name: Vulnerability Scan

# Daily scan of what lerd ships beyond its Go module, which CI's govulncheck
# covers: the web UI's npm tree, the published PHP base images and the pinned
# host tools. A base image with an Alpine fix out is rebuilt rather than
# reported, since its build runs apk upgrade (#2333).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

env:
  GRYPE: docker.io/anchore/grype:v0.120.1

jobs:
  ui:
    name: UI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        working-directory: internal/ui/web
        run: npm audit --audit-level=high

  images:
    name: PHP base images
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Same set check-upstream-php watches: 7.4 and 8.0 sit on end-of-life
      # Alpine branches that get no fixes, so a rebuild cannot help them.
      - name: Scan the published images
        id: scan
        run: |
          python3 <<'EOF'
          import hashlib, json, os, subprocess

          VERSIONS = ('8.1', '8.2', '8.3', '8.4', '8.5', '8.6')
          SEVERE = ('High', 'Critical')

          with open('internal/podman/quadlets/lerd-php-fpm.Containerfile') as f:
              recipe = f.read()
          for ph in ('{{.CustomExtensions}}', '{{.CustomExtensionsRuntime}}',
                     '{{.CustomPackages}}', '{{.MkcertCA}}'):
              recipe = recipe.replace(ph, '')
          tag = hashlib.sha256(recipe.encode()).hexdigest()[:12]

          stale, rows = [], []
          for version in VERSIONS:
              image = f'ghcr.io/lerd-env/lerd-php{version.replace(".", "")}-fpm-base:{tag}-amd64'
              out = subprocess.run(['docker', 'run', '--rm', os.environ['GRYPE'], f'registry:{image}',
                                    '--only-fixed', '-o', 'json'], capture_output=True, text=True, check=True).stdout
              found = [m for m in json.loads(out)['matches'] if m['vulnerability']['severity'] in SEVERE]
              # Only Alpine packages are ours to fix; bundled npm, Rust and Go
              # binaries wait on their packagers, so they are listed, not rebuilt.
              if any(m['artifact']['type'] == 'apk' for m in found):
                  stale.append(version)
              for m in found:
                  a, v = m['artifact'], m['vulnerability']
                  rows.append(f"| {version} | {a['type']} | {a['name']} {a['version']} | {v['id']} | {v['severity']} | {', '.join(v['fix']['versions'])} |")
              print(f'PHP {version}: {len(found)} fixable high or critical')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('| PHP | Type | Package | Vulnerability | Severity | Fixed in |\n|---|---|---|---|---|---|\n')
              s.write('\n'.join(rows) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'stale={",".join(stale)}\n')
          EOF

      - name: Trigger base image rebuild
        if: steps.scan.outputs.stale != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'base-images.yml',
              ref: 'main',
              inputs: {
                force_rebuild: 'true',
                versions: '${{ steps.scan.outputs.stale }}'
              }
            });

  tools:
    name: Host tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads every pin in tools.yaml as an install would. A stale pin is
      # check-upstream-tools' job; this catches a current one that is vulnerable.
      - name: Download the pinned tools
        run: |
          set -euo pipefail
          FILE=internal/tools/tools.yaml
          mkdir -p /tmp/tools
          # mkcert's last release (2022) is built with Go 1.18, so no pin bump
          # clears it; it stays out until lerd issues certs without it.
          for tool in $(yq -r '.tools | keys | .[] | select(. != "mkcert")' "$FILE"); do
            version=$(yq -r ".tools.\"${tool}\".version" "$FILE")
            url=$(yq -r ".tools.\"${tool}\".url" "$FILE")
            asset=$(yq -r ".tools.\"${tool}\".assets.\"linux/amd64\" // \"\"" "$FILE")
            asset="${asset//\{version\}/$version}"
            url="${url//\{version\}/$version}"
            url="${url//\{asset\}/$asset}"
            dir="/tmp/tools/${tool}"
            mkdir -p "$dir"
            curl -fsSL -o "${dir}/${url##*/}" "$url"
            case "$url" in
              *.tar.gz) tar -xzf "${dir}/${url##*/}" -C "$dir" ;;
              *.zip) unzip -qo "${dir}/${url##*/}" -d "$dir" ;;
            esac
          done

      - name: Scan
        run: docker run --rm -v /tmp/tools:/scan:ro "$GRYPE" dir:/scan --only-fixed --fail-on high
